name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: lint + fast tests (no model weights)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install runtime + test deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0" "torchvision==0.29.0"
          pip install -r requirements-test.txt
      - name: Ruff lint
        run: |
          pip install "ruff==0.14.13"
          ruff check app tests src
          ruff format --check app tests || true
      - name: Fast unit tests (config/contracts/schemas)
        run: |
          pytest tests/test_config_and_contracts.py tests/test_schemas_and_errors.py -v

  authentic-evaluation:
    name: authentic_testing evaluation (real checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install runtime + test deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0" "torchvision==0.29.0"
          pip install -r requirements-test.txt
      - name: Verify checkpoint + corpus present
        run: |
          ls -lh models/oil_spill_segmentation_model.pth
          ls "data/authentic testing/02_Test_images_and_ground_truth/Images/Oil" | head -n 3
      - name: Full test suite (fast subset + integration)
        env:
          OILSPILL_TEST_DOWNSCALE: "8"
          OILSPILL_TEST_SCENES_PER_CLASS: "3"
        run: |
          pytest tests/ -v -m "not slow"
