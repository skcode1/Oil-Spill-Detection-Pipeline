[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-spill-detection-pipeline"
version = "1.0.0"
description = "Marine Oil Spill Detection & Vessel Attribution API"
readme = "README.md"
requires-python = ">=3.10"
# Runtime pins mirror requirements.txt (the deploy source of truth).
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "segmentation-models-pytorch==0.5.0",
  "timm==1.0.29",
  "safetensors==0.8.0",
  "rasterio==1.5.1",
  "geopandas==1.1.4",
  "shapely==2.1.2",
  "pyproj==3.7.2",
  "tifffile==2026.8.23",
  "pillow==12.3.0",
  "opencv-python-headless==5.0.0.93",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "pyarrow==25.0.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "python-multipart==0.0.32",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "opendrift==1.14.12",
  "netCDF4==1.7.4",
  "xarray==2026.7.0",
  "adios-db==1.2.7",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-timeout==2.4.0", "httpx==0.28.1"]
dashboard = ["streamlit==1.64.0", "pydeck==0.9.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --timeout=600"
timeout = 600
markers = [
  "slow: marks tests as slow (end-to-end model inference; deselect with '-m \"not slow\"')",
  "integration: live FastAPI integration tests (TestClient)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Production lint gate: real bugs + import order + whitespace.
select = ["E", "F", "W", "B", "I"]
# E501: line length handled by black/formatter
# B008: FastAPI Depends() in default arguments
# B023: loop variables in closures
# B905: zip() strict= (opt-in; legacy Python compatibility)
# E402: sys.path manipulation in standalone CLI scripts before local src.* imports
ignore = ["E501", "B008", "B023", "B905", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src", "tests"]
